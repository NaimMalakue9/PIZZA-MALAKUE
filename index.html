<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Malakue</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #FFF8F0; }
    input[type="image"] {
      width: 100%;
      height: 96px;
      object-fit: cover;
      border-radius: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .tiktok-btn {
      background: #000;
      border: 2px solid;
      border-image: linear-gradient(90deg, #25F4EE, #FE2C55) 1;
    }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-md mx-auto p-4">

    <!-- HALAMAN AWAL -->
    <div id="page1" class="min-h-screen flex flex-col justify-center items-center text-center gap-3">
      <h1 class="text-3xl font-bold text-black mb-2">WELCOME!!!</h1>
      <p class="text-lg font-semibold text-gray-800">PIZZA MALAKUE</p>
      <p class="text-sm text-gray-600 mb-2">Homemade, Fresh From The Oven</p>
      <p class="text-sm font-semibold text-green-600 mb-4">● BUKA - 10.00 s/d 21.00 WITA</p>
      
      <button id="btnBukaMenu" class="w-full max-w-xs bg-[#E65100] text-white py-4 rounded-xl font-bold text-lg">
        🍕 Buat Pesanan Anda Disini
      </button>

      <a href="https://tiktok.com/@pizzamalakue" target="_blank" 
         class="w-full max-w-xs tiktok-btn text-white py-4 rounded-xl font-bold text-lg text-center flex items-center justify-center gap-2">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.39 6.3-1.98.02.89.04 1.79.03 2.69-.77-.17-1.5-.28-2.29-.38-.46-.06-.89-.14-1.34-.21-.56.87-.94 1.92-.99 2.98-.1 1.84.93 3.59 2.6 4.4 1.04.52 2.18.79 3.28.93.86.1 1.72.07 2.58.02.8-.05 1.6-.13 2.37-.33.99-.24 1.95-.66 2.8-1.23.86-.58 1.63-1.31 2.21-2.11.58-.8 1.02-1.74 1.24-2.7.08-.4.12-.81.13-1.23.02-1.06-.01-2.12-.04-3.18-.02-1.36-.01-2.72-.03-4.08-.01-.17-.02-.34-.03-.51.27-.08.56-.13.84-.19.26-.06.52-.11.78-.17.17-.05.34-.09.51-.14.1-.04.2-.07.3-.11.22-.09.43-.18.64-.27.1-.05.2-.1.28-.15.07-.05.14-.1.21-.15.06-.05.12-.1.18-.15.02-.02.05-.03.07-.05z"/>
        </svg>
        TikTok
      </a>
    </div>

    <!-- HALAMAN MENU -->
    <div id="page2" style="display:none;">
      <button id="btnBalikAwal" class="text-[#E65100] font-bold mb-4">← Kembali</button>
      <h2 class="text-xl font-bold text-[#5D4037] text-center mb-4">Pilih Menu Favoritmu</h2>

      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <input type="image" src="pizza-coklat-mozarella.jpg" onclick="alert('Pizza Coklat Mozarella')" />
          <h3 class="font-bold text-[#5D4037] text-sm mt-2">Coklat Mozarella</h3>
          <p class="text-lg font-bold text-[#E65100]">33rb</p>
        </div>
        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <input type="image" src="pizza-coklat-keju-cedar.jpg" onclick="alert('Pizza Coklat Keju Cedar')" />
          <h3 class="font-bold text-[#5D4037] text-sm mt-2">Coklat Keju Cedar</h3>
          <p class="text-lg font-bold text-[#E65100]">28rb</p>
        </div>
        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <input type="image" src="pizza-party.jpg" onclick="alert('Pizza Party')" />
          <h3 class="font-bold text-[#5D4037] text-sm mt-2">Party</h3>
          <p class="text-lg font-bold text-[#E65100]">85rb</p>
        </div>
        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <input type="image" src="pizza-vulcano-non-pedas.jpg" onclick="alert('Pizza Vulcano Non Pedas')" />
          <h3 class="font-bold text-[#5D4037] text-sm mt-2">Vulcano Non Pedas</h3>
          <p class="text-lg font-bold text-[#E65100]">45rb</p>
        </div>
        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <input type="image" src="pizza-vulcano-pedas.jpg" onclick="alert('Pizza Vulcano Pedas')" />
          <h3 class="font-bold text-[#5D4037] text-sm mt-2">Vulcano Pedas</h3>
          <p class="text-lg font-bold text-[#E65100]">45rb</p>
        </div>
      </div>
    </div>

  </div>

<script>
document.getElementById('btnBukaMenu').onclick = function() {
  document.getElementById('page1').style.display = 'none';
  document.getElementById('page2').style.display = 'block';
};
document.getElementById('btnBalikAwal').onclick = function() {
  document.getElementById('page2').style.display = 'none';
  document.getElementById('page1').style.display = 'flex';
};
</script>
</body>
</html>
