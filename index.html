<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pizza Malakue - Homemade Fresh From The Oven</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      font-family: sans-serif; 
      background-color: #FFF8F0;
    }
    .pizza-btn {
      width: 100%;
      height: 96px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-md mx-auto p-4">

    <!-- HALAMAN 1 -->
    <div id="page1" class="min-h-screen flex-col justify-center items-center text-center">
      <p class="text-[#5D4037] text-sm mb-2">Terima kasih sudah klik Link Tautannya</p>
      <h1 class="text-3xl font-bold text-black mb-1">WELCOME!!!</h1>
      <h2 class="text-lg text-[#5D4037] mb-1">PIZZA MALAKUE</h2>
      <button id="btnBukaMenu" class="w-full max-w-xs bg-[#E65100] text-white py-4 rounded-xl font-bold text-lg mb-4">
        🍕 Buat Pesanan Anda Disini
      </button>
    </div>

    <!-- HALAMAN 2 -->
    <div id="page2" style="display:none;">
      <header class="text-center py-4">
        <button id="btnBalikAwal" class="float-left text-[#E65100] font-bold">← Kembali</button>
        <h1 class="text-3xl font-bold text-[#E65100]">Pizza Malakue</h1>
      </header>

      <div class="grid grid-cols-2 gap-3 my-6">
        <!-- MENU 1 -->
        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <button class="pizza-btn" style="background-image: url('pizza-coklat-mozarella.jpg');" 
                  onclick="alert('Pizza Coklat Mozarella')"></button>
          <h3 class="font-bold text-[#5D4037] text-sm mt-2">Coklat Mozarella</h3>
          <p class="text-lg font-bold text-[#E65100] my-1">33rb</p>
          <div class="flex items-center justify-center gap-2 mt-2">
            <button id="btnMinus1" class="bg-orange-200 text-[#E65100] w-7 h-7 rounded-full font-bold">-</button>
            <span id="coklatMocarella">0</span>
            <button id="btnPlus1" class="bg-[#E65100] text-white w-7 h-7 rounded-full font-bold">+</button>
          </div>
        </div>

        <!-- MENU 2 -->
        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <button class="pizza-btn" style="background-image: url('pizza-coklat-keju-cedar.jpg');" 
                  onclick="alert('Pizza Coklat Keju Cedar')"></button>
          <h3 class="font-bold text-[#5D4037] text-sm mt-2">Coklat Keju Cedar</h3>
          <p class="text-lg font-bold text-[#E65100] my-1">28rb</p>
          <div class="flex items-center justify-center gap-2 mt-2">
            <button id="btnMinus2" class="bg-orange-200 text-[#E65100] w-7 h-7 rounded-full font-bold">-</button>
            <span id="coklatKeju">0</span>
            <button id="btnPlus2" class="bg-[#E65100] text-white w-7 h-7 rounded-full font-bold">+</button>
          </div>
        </div>

        <!-- MENU 3 -->
        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <button class="pizza-btn" style="background-image: url('pizza-party.jpg');" 
                  onclick="alert('Pizza Party')"></button>
          <h3 class="font-bold text-[#5D4037] text-sm mt-2">Party</h3>
          <p class="text-lg font-bold text-[#E65100] my-1">85rb</p>
          <div class="flex items-center justify-center gap-2 mt-2">
            <button id="btnMinus3" class="bg-orange-200 text-[#E65100] w-7 h-7 rounded-full font-bold">-</button>
            <span id="party">0</span>
            <button id="btnPlus3" class="bg-[#E65100] text-white w-7 h-7 rounded-full font-bold">+</button>
          </div>
        </div>

        <!-- MENU 4 -->
        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <button class="pizza-btn" style="background-image: url('pizza-vulcano-non-pedas.jpg');" 
                  onclick="alert('Pizza Vulcano Non Pedas')"></button>
          <h3 class="font-bold text-[#5D4037] text-sm mt-2">Vulcano Non Pedas</h3>
          <p class="text-lg font-bold text-[#E65100] my-1">45rb</p>
          <div class="flex items-center justify-center gap-2 mt-2">
            <button id="btnMinus4" class="bg-orange-200 text-[#E65100] w-7 h-7 rounded-full font-bold">-</button>
            <span id="vulcanoNon">0</span>
            <button id="btnPlus4" class="bg-[#E65100] text-white w-7 h-7 rounded-full font-bold">+</button>
          </div>
        </div>

        <!-- MENU 5 -->
        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <button class="pizza-btn" style="background-image: url('pizza-vulcano-pedas.jpg');" 
                  onclick="alert('Pizza Vulcano Pedas')"></button>
          <h3 class="font-bold text-[#5D4037] text-sm mt-2">Vulcano Pedas</h3>
          <p class="text-lg font-bold text-[#E65100] my-1">45rb</p>
          <div class="flex items-center justify-center gap-2 mt-2">
            <button id="btnMinus5" class="bg-orange-200 text-[#E65100] w-7 h-7 rounded-full font-bold">-</button>
            <span id="vulcanoPedas">0</span>
            <button id="btnPlus5" class="bg-[#E65100] text-white w-7 h-7 rounded-full font-bold">+</button>
          </div>
        </div>
      </div>

      <button id="btnKirimWA" class="w-full bg-[#E65100] text-white py-4 rounded-xl font-bold text-lg">
        🛒 Kirim Pesanan
      </button>
    </div>

  </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('btnBukaMenu').addEventListener('click', function() {
    document.getElementById('page1').style.display = 'none';
    document.getElementById('page2').style.display = 'block';
  });
  
  document.getElementById('btnBalikAwal').addEventListener('click', function() {
    document.getElementById('page2').style.display = 'none';
    document.getElementById('page1').style.display = 'flex';
  });

  // Counter logic
  let counts = {coklatMocarella:0, coklatKeju:0, party:0, vulcanoNon:0, vulcanoPedas:0};
  
  document.getElementById('btnPlus1').onclick = () => {counts.coklatMocarella++; document.getElementById('coklatMocarella').innerText = counts.coklatMocarella;}
  document.getElementById('btnMinus1').onclick = () => {if(counts.coklatMocarella>0)counts.coklatMocarella--; document.getElementById('coklatMocarella').innerText = counts.coklatMocarella;}
  document.getElementById('btnPlus2').onclick = () => {counts.coklatKeju++; document.getElementById('coklatKeju').innerText = counts.coklatKeju;}
  document.getElementById('btnMinus2').onclick = () => {if(counts.coklatKeju>0)counts.coklatKeju--; document.getElementById('coklatKeju').innerText = counts.coklatKeju;}
  document.getElementById('btnPlus3').onclick = () => {counts.party++; document.getElementById('party').innerText = counts.party;}
  document.getElementById('btnMinus3').onclick = () => {if(counts.party>0)counts.party--; document.getElementById('party').innerText = counts.party;}
  document.getElementById('btnPlus4').onclick = () => {counts.vulcanoNon++; document.getElementById('vulcanoNon').innerText = counts.vulcanoNon;}
  document.getElementById('btnMinus4').onclick = () => {if(counts.vulcanoNon>0)counts.vulcanoNon--; document.getElementById('vulcanoNon').innerText = counts.vulcanoNon;}
  document.getElementById('btnPlus5').onclick = () => {counts.vulcanoPedas++; document.getElementById('vulcanoPedas').innerText = counts.vulcanoPedas;}
  document.getElementById('btnMinus5').onclick = () => {if(counts.vulcanoPedas>0)counts.vulcanoPedas--; document.getElementById('vulcanoPedas').innerText = counts.vulcanoPedas;}

  document.getElementById('btnKirimWA').onclick = () => {
    alert('Pesanan terkirim!');
  }
});
</script>
</body>
</html>
