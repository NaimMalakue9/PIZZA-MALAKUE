<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Malakue - Homemade, Fresh From The Oven</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-b from-amber-50 to-orange-100 min-h-screen">
  <div class="max-w-md mx-auto p-4">

    <!-- HEADER -->
    <header class="text-center py-6">
      <h1 class="text-4xl font-bold text-orange-600">Pizza Malakue</h1>
      <p class="text-lg text-orange-700 mt-1">Homemade, Fresh From The Oven</p>
    </header>

    <!-- TAMPILAN AWAL: TOMBOL SOSMED + ORDER -->
    <div id="landingPage" class="my-6 space-y-3">
      
      <!-- TOMBOL BUAT PESANAN - KLIK INI MUNCUL MENU -->
      <button onclick="showMenu()" class="w-full bg-orange-500 text-white p-4 rounded-2xl shadow-lg font-bold text-lg hover:bg-orange-600 mb-6">
        🍕 Buat Pesanan Anda Disini
      </button>

      <!-- GRAB FOOD -->
      <a href="LINK_GRABFOOD_LU" target="_blank" class="flex items-center bg-white p-4 rounded-2xl shadow-md hover:shadow-lg">
        <img src="https://cdn-icons-png.flaticon.com/512/732/732217.png" alt="Grab" class="w-10 h-10 mr-4 object-contain">
        <span class="font-bold text-gray-800">Pesan via Grab</span>
      </a>

      <!-- WHATSAPP -->
      <a href="https://wa.me/6282193795771" target="_blank" class="flex items-center bg-white p-4 rounded-2xl shadow-md hover:shadow-lg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/WhatsApp.svg/1024px-WhatsApp.svg.png" alt="WhatsApp" class="w-10 h-10 mr-4">
        <span class="font-bold text-gray-800">Order via WhatsApp</span>
      </a>

      <!-- INSTAGRAM -->
      <a href="LINK_IG_LU" target="_blank" class="flex items-center bg-white p-4 rounded-2xl shadow-md hover:shadow-lg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/2048px-Instagram_icon.png" alt="Instagram" class="w-10 h-10 mr-4">
        <span class="font-bold text-gray-800">Instagram</span>
      </a>

      <!-- TIKTOK -->
      <a href="LINK_TIKTOK_LU" target="_blank" class="flex items-center bg-white p-4 rounded-2xl shadow-md hover:shadow-lg">
        <img src="https://cdn.pixabay.com/photo/2021/06/15/12/28/tiktok-6338432_960_720.png" alt="TikTok" class="w-10 h-10 mr-4">
        <span class="font-bold text-gray-800">TikTok</span>
      </a>

      <!-- GOFOOD -->
      <a href="LINK_GOFOOD_LU" target="_blank" class="flex items-center bg-white p-4 rounded-2xl shadow-md hover:shadow-lg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Gofood_logo.svg/1200px-Gofood_logo.svg.png" alt="GoFood" class="w-10 h-10 mr-4 object-contain">
        <span class="font-bold text-gray-800">GOFOOD</span>
      </a>
    </div>

    <!-- HALAMAN MENU - AWALNYA KESEMBUNYI -->
    <div id="menuPage" class="hidden">
      <button onclick="showLanding()" class="mb-4 text-orange-600 font-bold">← Kembali</button>
      <h2 class="text-2xl font-bold text-orange-800 text-center mb-4">Pilih Menu Favoritmu</h2>

      <!-- LIST MENU 2 KOLOM -->
      <div class="grid grid-cols-2 gap-4 my-6">
        <!-- PRODUK 1 -->
        <div class="bg-white rounded-2xl shadow-lg p-4 text-center">
          <div class="text-5xl mb-2">🍕</div>
          <h3 class="font-bold text-orange-800 text-sm">Sosis</h3>
          <p class="text-lg font-bold text-orange-600 my-1">Rp 10.000</p>
          <div class="flex items-center justify-center gap-3 mt-2">
            <button onclick="updateQty('sosis', -1)" class="bg-orange-200 text-orange-800 w-7 h-7 rounded-full font-bold">-</button>
            <span id="qty-sosis" class="font-bold w-5">0</span>
            <button onclick="updateQty('sosis', 1)" class="bg-orange-500 text-white w-7 h-7 rounded-full font-bold">+</button>
          </div>
        </div>

        <!-- PRODUK 2 -->

          </div>
        </div>

        <!-- PRODUK 3 -->
        <div class="bg-white rounded-2xl shadow-lg p-4 text-center">
          <div class="text-5xl mb-2">🍕</div>
          <h3 class="font-bold text-orange-800 text-sm">Kornet</h3>
          <p class="text-lg font-bold text-orange-600 my-1">Rp 10.000</p>

            <button onclick="updateQty('kornet', 1)" class="bg-orange-500 text-white w-7 h-7 rounded-full font-bold">+</button>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-4 text-center">
          <div class="text-5xl mb-2">🍕</div>
          <h3 class="font-bold text-orange-800 text-sm">Ayam Pedas</h3>
          <p class="text-lg
