<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Malakue</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-amber-50 to-orange-100 min-h-screen">
  <div class="max-w-md mx-auto p-4">

    <!-- HALAMAN 1: TAMPILAN AWAL -->
    <div id="page1" class="min-h-screen flex flex-col justify-center items-center text-center">
      <p class="text-gray-600 text-sm mb-2">TERIMA KASIH SUDAH DI KLIK LINK NYA</p>
      <h1 class="text-3xl font-bold text-gray-800 mb-1">WELCOME!!!</h1>
      <h2 class="text-lg text-gray-700 mb-8">PIZZA MALAKUE</h2>

      <button onclick="bukaMenu()" class="w-full max-w-xs border-2 border-black py-3 font-bold text-black mb-4 bg-white">
        Buat Pesanan Anda Disini
      </button>

      <a href="https://tiktok.com" target="_blank" class="w-full max-w-xs border-2 border-black py-3 font-bold text-black bg-white text-center">
        TikTok
      </a>
    </div>

    <!-- HALAMAN 2: MENU -->
    <div id="page2" style="display:none;">
      <header class="text-center py-4">
        <button onclick="balikAwal()" class="float-left text-orange-600 font-bold">← Kembali</button>
        <h1 class="text-3xl font-bold text-orange-600">Pizza Malakue</h1>
        <p class="text-sm text-orange-700">Homemade, Fresh From The Oven</p>
      </header>

      <h2 class="text-xl font-bold text-orange-800 text-center my-4">Pilih Menu Favoritmu</h2>

      <div class="grid grid-cols-2 gap-3 my-6">
        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <div class="text-4xl mb-1">🍕</div>
          <h3 class="font-bold text-orange-800 text-sm">Sosis</h3>
          <p class="text-lg font-bold text-orange-600 my-1">10rb</p>
          <div class="flex items-center justify-center gap-2 mt-2">
            <button onclick="kurang('sosis')" class="bg-orange-200 text-orange-800 w-7 h-7 rounded-full font-bold">-</button>
            <span id="sosis" class="font-bold w-4">0</span>
            <button onclick="tambah('sosis')" class="bg-orange-500 text-white w-7 h-7 rounded-full font-bold">+</button>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <div class="text-4xl mb-1">🍕</div>
          <h3 class="font-bold text-orange-800 text-sm">Sosis Ayam</h3>
          <p class="text-lg font-bold text-orange-600 my-1">10rb</p>
          <div class="flex items-center justify-center gap-2 mt-2">
            <button onclick="kurang('sosisAyam')" class="bg-orange-200 text-orange-800 w-7 h-7 rounded-full font-bold">-</button>
            <span id="sosisAyam" class="font-bold w-4">0</span>
            <button onclick="tambah('sosisAyam')" class="bg-orange-500 text-white w-7 h-7 rounded-full font-bold">+</button>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <div class="text-4xl mb-1">🍕</div>
          <h3 class="font-bold text-orange-800 text-sm">Kornet</h3>
          <p class="text-lg font-bold text-orange-600 my-1">10rb</p>
          <div class="flex items-center justify-center gap-2 mt-2">
            <button onclick="kurang('kornet')" class="bg-orange-200 text-orange-800 w-7 h-7 rounded-full font-bold">-</button>
            <span id="kornet" class="font-bold w-4">0</span>
            <button onclick="tambah('kornet')" class="bg-orange-500 text-white w-7 h-7 rounded-full font-bold">+</button>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-3 text-center">
          <div class="text-4xl mb-1">🍕</div>
          <h3 class="font-bold text-orange-800 text-sm">Ayam Pedas</h3>
          <p class="text-lg font-bold text-orange-600 my-1">12rb</p>
          <div class="flex items-center justify-center gap-2 mt-2">
            <button onclick="kurang('ayamPedas')" class="bg-orange-200 text-orange-800 w-7 h-7 rounded-full font-bold">-</button>
            <span id="ayamPedas" class="font-bold w-4">0</span>
            <button onclick="tambah('ayamPedas')" class="bg-orange-500 text-white w-7 h-7 rounded-full font-bold">+</button>
          </div>
        </div>
      </div>

      <button onclick="qrisMuncul()" class="w-full bg-green-500 text-white py-3 rounded-xl font-bold text-lg mb-4">
        💳 Bayar Pakai QRIS
      </button>

      <div class="fixed bottom-4 left-4 right-4 max-w-md mx-auto">
        <button onclick="kirimWA()" class="w-full bg-orange-500 text-white py-4 rounded-xl font-bold text-lg shadow-2xl">
          🛒 Kirim Pesanan - <span id="total">Rp 0</span>
        </button>
      </div>
    </div>

    <!-- POP-UP QRIS -->
    <div id="popupQris" style="display:none;" class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4" onclick="qrisTutup()">
      <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center" onclick="event.stopPropagation()">
        <h3 class="text-xl font-bold text-orange-800 mb-4">Scan QRIS Pizza Malakue</h3>
        <img src="qris-pizza-malakue.jpg" alt="QRIS" class="w-full rounded-xl shadow-md mb-4">
        <p class="text-sm text-gray-600 mb-4">a.n. MUHAMMAD NAIM MU'MIN</p>
        <button onclick="qrisTutup()" class="bg-orange-500 text-white px-6 py-2 rounded-lg font-bold">Tutup</button>
      </div>
    </div>

  </div>

<script>
var jmlSosis = 0;
var jmlSosisAyam = 0;
var jmlKornet = 0;
var jmlAyamPedas = 0;

function bukaMenu() {
  document.getElementById('page1').style.display = 'none';
  document.getElementById('page2').style.display = 'block';
}

function balikAwal() {
  document.getElementById('page2').style.display = 'none';
  document.getElementById('page1').style.display = 'flex';
}

function tambah(menu) {
  if(menu == 'sosis') {
    jmlSosis++;
    document.getElementById('sosis').innerText = jmlSosis;
  }
  if(menu == 'sosisAyam') {
    jmlSosisAyam++;
    document.getElementById('sosisAyam').innerText = jmlSosisAyam;
  }
  if(menu == 'kornet') {
    jmlKornet++;
    document.getElementById('kornet').innerText = jmlKornet;
  }
  if(menu == 'ayamPedas') {
    jmlAyamPedas++;
    document.getElementById('ayamPedas').innerText = jmlAyamPedas;
  }
  hitungTotal();
}

function kurang(menu) {
  if(menu == 'sosis' && jmlSosis > 0) {
    jmlSosis--;
    document.getElementById('sosis').innerText = jmlSosis;
  }
  if(menu == 'sosisAyam' && jmlSosisAyam > 0) {
    jmlSosisAyam--;
    document.getElementById('sosisAyam').innerText = jmlSosisAyam;
  }

    jmlKornet--;
    document.getElementById('kornet').innerText = jmlKornet;
  }
  if(menu == 'ayamPedas' && jmlAyamPedas > 0) {
    jmlAyamPedas--;
    document.getElementById('ayamPedas').innerText = jmlAyamPedas;
  }
  hitungTotal();
}

  var total = (jmlSosis * 10000) + (jmlSosisAyam * 10000) + (jmlKornet * 10000) + (jmlAyamPedas * 12000);
  document.getElementById('total').innerText = 'Rp ' + total.toLocaleString('id-ID');
}
